[package]
name = "cargo-equip"
version = "0.20.2-alpha.1"
edition = "2018"
license = "MIT OR Apache-2.0"
description = "A Cargo subcommand to bundle your code into one `.rs` file for competitive programming. Personal fork of qryxip/cargo-equip."
repository = "https://github.com/cacampu/cargo-equip"
keywords = ["competitive", "cli", "windows"]
categories = ["command-line-utilities", "development-tools::cargo-plugins"]
# This fork is not published; the `cargo-equip` name on crates.io belongs to the original.
publish = false

[dependencies]
anyhow = "1.0.72"
camino = { version = "1.1.6", features = ["serde1"] }
cargo-util = "0.1.2"
cargo_metadata = "0.23"
cfg-expr = "0.20"
derive_more = { version = "2.1", features = ["display"] }
dirs = "5.0.1"
fixedbitset = "0.5"
if_chain = "1.0.2"
indoc = "2.0"
itertools = "0.15"
maplit = "1.0.2"
petgraph = "0.8"
prettytable-rs = "0.10.0"
proc-macro2 = { version = "1.0.66", features = ["span-locations"] }
quote = "1.0.32"
ra_ap_paths = "=0.0.309"
ra_ap_proc_macro_api = "=0.0.309"
ra_ap_tt = "=0.0.309"
ra_ap_span = "=0.0.309"
rand = "0.10"
rustminify = "0.2.0"
semver = { version = "1.0.18", features = ["serde"] }
serde = { version = "1.0.181", features = ["derive"] }
serde_json = "1.0.104"
spdx = "0.13"
clap = { version = "4.5.20", features = ["derive"] }
strum = { version = "0.28", features = ["derive"] }
syn = { version = "2", features = ["extra-traits", "full", "parsing", "visit"] }
tap = "1.0.1"
tempfile = "3.27"
termcolor = "1.4"
toml = "0.7.6"
toml_edit = "0.5.0"
which = "8.0"

[dev-dependencies]
assert_cmd = "2.0.12"
insta = "1.31.0"
once_cell = "1.18.0"
pretty_assertions = "1.4.0"
